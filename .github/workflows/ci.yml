name: Community Build
run-name: Community Build / ${{ inputs.metals }}

on:
  workflow_dispatch:
    inputs:
      metals:
        description: "Metals branch/commit/tag URL (for example: https://github.com/scalameta/metals/tree/main-v2)"
        required: true
        type: string

permissions:
  contents: read

jobs:
  projects:
    name: Discover community projects
    runs-on: ubuntu-latest
    outputs:
      bazelMatrix: ${{ steps.matrix.outputs.bazelMatrix }}
      mavenMatrix: ${{ steps.matrix.outputs.mavenMatrix }}
      gradleMatrix: ${{ steps.matrix.outputs.gradleMatrix }}
      hasBazel: ${{ steps.matrix.outputs.hasBazel }}
      hasMaven: ${{ steps.matrix.outputs.hasMaven }}
      hasGradle: ${{ steps.matrix.outputs.hasGradle }}
      metalsRepository: ${{ steps.matrix.outputs.metalsRepository }}
      metalsRef: ${{ steps.matrix.outputs.metalsRef }}
      metalsVersion: ${{ steps.matrix.outputs.metalsVersion }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json
      - name: Install community build dependencies
        run: npm ci
      - id: matrix
        name: Validate manifests and create matrix
        run: npm run matrix -- --github-output --metals "$METALS_SOURCE"
        env:
          METALS_SOURCE: ${{ inputs.metals }}

  build-metals:
    name: Build Metals
    needs: projects
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Check out Metals
        uses: actions/checkout@v7
        with:
          repository: ${{ needs.projects.outputs.metalsRepository }}
          ref: ${{ needs.projects.outputs.metalsRef }}
          path: workspaces/metals
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Set up Coursier
        uses: coursier/setup-action@v3

      - name: Cache Coursier dependencies
        uses: coursier/cache-action@v8
        with:
          ignoreJob: true

      - name: Set up sbt
        uses: sbt/setup-sbt@v1

      - name: Publish the selected Metals server locally
        run: sbt --client quick-publish-local
        working-directory: workspaces/metals
        env:
          METALS_TEST: true
          METALS_VERSION: ${{ needs.projects.outputs.metalsVersion }}.${{ github.run_id }}

      - name: Bundle local Metals repositories
        shell: bash
        run: |
          test -d "$HOME/.ivy2/local/org.scalameta"
          test -d "$HOME/.m2/repository/org/scalameta"
          tar -C "$HOME" -czf "$RUNNER_TEMP/metals-local.tgz" \
            .ivy2/local/org.scalameta \
            .m2/repository/org/scalameta

      - name: Upload local Metals repositories
        uses: actions/upload-artifact@v7
        with:
          name: metals-local-${{ github.run_id }}
          path: ${{ runner.temp }}/metals-local.tgz
          if-no-files-found: error
          compression-level: 0
          retention-days: 1

  prepare-runtime:
    name: Prepare VS Code test runtime
    needs: projects
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Check out the community build
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"
          cache: npm
          cache-dependency-path: package-lock.json

      - id: runtime-cache
        name: Restore the VS Code test runtime cache
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            .test-resources
            .test-extensions
          key: test-runtime-node24-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'community-build.json') }}

      - name: Prepare the VS Code test runtime
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        run: |
          npm ci
          npm run setup:vscode

      - name: Save the VS Code test runtime cache
        if: steps.runtime-cache.outputs.cache-hit != 'true'
        uses: actions/cache/save@v6
        with:
          path: |
            node_modules
            .test-resources
            .test-extensions
          key: test-runtime-node24-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'community-build.json') }}

  bazel:
    name: Bazel
    needs: [projects, build-metals, prepare-runtime]
    if: needs.projects.outputs.hasBazel == 'true'
    uses: ./.github/workflows/test-projects.yml
    with:
      matrix: ${{ needs.projects.outputs.bazelMatrix }}
      metalsVersion: ${{ needs.projects.outputs.metalsVersion }}.${{ github.run_id }}

  maven:
    name: Maven
    needs: [projects, build-metals, prepare-runtime]
    if: needs.projects.outputs.hasMaven == 'true'
    uses: ./.github/workflows/test-projects.yml
    with:
      matrix: ${{ needs.projects.outputs.mavenMatrix }}
      metalsVersion: ${{ needs.projects.outputs.metalsVersion }}.${{ github.run_id }}

  gradle:
    name: Gradle
    needs: [projects, build-metals, prepare-runtime]
    if: needs.projects.outputs.hasGradle == 'true'
    uses: ./.github/workflows/test-projects.yml
    with:
      matrix: ${{ needs.projects.outputs.gradleMatrix }}
      metalsVersion: ${{ needs.projects.outputs.metalsVersion }}.${{ github.run_id }}
