name: Test community projects

on:
  workflow_call:
    inputs:
      matrix:
        description: "Project matrix for one build tool"
        required: true
        type: string
      metalsVersion:
        description: "Locally published Metals version"
        required: true
        type: string

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.projectName }}
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix: ${{ fromJSON(inputs.matrix) }}

    steps:
      - name: Check out the community build
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Check out ${{ matrix.projectName }}
        uses: actions/checkout@v7
        with:
          repository: ${{ matrix.repository }}
          ref: ${{ matrix.ref }}
          path: workspaces/project
          fetch-depth: 1
          persist-credentials: false

      - name: Set up Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Cache Coursier dependencies
        uses: coursier/cache-action@v8
        with:
          ignoreJob: true

      - name: Download the published Metals server
        uses: actions/download-artifact@v8
        with:
          name: metals-local-${{ github.run_id }}
          path: ${{ runner.temp }}/metals-local

      - name: Restore local Metals repositories
        shell: bash
        run: tar -C "$HOME" -xzf "$RUNNER_TEMP/metals-local/metals-local.tgz"

      - name: Set up Bazel
        if: matrix.buildTool == 'bazel'
        uses: bazel-contrib/setup-bazel@0.19.0
        with:
          module-root: ${{ matrix.workspacePath }}
          bazelisk-cache: true
          repository-cache: true
          cache-save: true

      - name: Set up Gradle
        if: matrix.buildTool == 'gradle'
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version: "24"

      - name: Restore the VS Code test runtime cache
        uses: actions/cache/restore@v6
        with:
          path: |
            node_modules
            .test-resources
            .test-extensions
          key: test-runtime-node24-${{ runner.os }}-${{ runner.arch }}-${{ hashFiles('package-lock.json', 'community-build.json') }}
          fail-on-cache-miss: true

      - name: Compile community build tests
        run: npm run compile

      - name: Run project scenarios
        shell: bash
        run: |
          set -euo pipefail
          report_directory="$GITHUB_WORKSPACE/.test-report"
          mkdir -p "$report_directory"
          exec > >(tee "$report_directory/job.log") 2>&1
          metals_directory="$METALS_COMMUNITY_WORKSPACE/.metals"
          metals_log="$metals_directory/metals.log"
          mkdir -p "$metals_directory"
          touch "$metals_log"
          tail -n +1 -F "$metals_log" > >(sed -u 's/^/[metals] /') &
          metals_log_pid=$!
          trap 'kill "$metals_log_pid" 2>/dev/null || true' EXIT
          xvfb-run -a npm run test:e2e:prepared
        env:
          COMMUNITY_BUILD_PROJECT_CONFIG: ${{ matrix.config }}
          COMMUNITY_BUILD_REPORT_DIR: ${{ github.workspace }}/.test-report
          METALS_COMMUNITY_WORKSPACE: ${{ github.workspace }}/${{ matrix.workspacePath }}
          METALS_COMMUNITY_METALS_VERSION: ${{ inputs.metalsVersion }}

      - name: Upload test diagnostics
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: diagnostics-${{ matrix.buildTool }}-${{ matrix.project }}-${{ github.run_id }}
          path: |
            .test-report
            ${{ matrix.workspacePath }}/.metals/metals.log
            ${{ matrix.workspacePath }}/.metals/mbt.json
          if-no-files-found: ignore
          include-hidden-files: true
          retention-days: 7
